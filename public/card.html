<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>EuroPicks · tarjeta del pick</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>html, body { margin: 0; background: #0b0f17; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<!-- Imagen 1200×675 para X (la genera el robot de tuits).
     card?l=euroleague          → pick más seguro del día
     card?l=euroleague&g=<id>   → el mejor pick de ESE partido (o su previa si no hay pick) -->
<canvas id="c" width="1200" height="675"></canvas>
<script src="cardgen.js"></script>
<script>
const QS = new URLSearchParams(location.search);
renderCard(document.getElementById('c'), { league: QS.get('l'), gameId: QS.get('g') }).then(() => { document.title = 'READY'; });
</script>
</body>
</html>
