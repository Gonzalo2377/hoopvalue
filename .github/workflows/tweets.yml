name: Publicaciones en X

# Cada 15 minutos el robot de tuits mira qué toca (robot/tweet.js):
#   · Euroliga: un tuit por partido ~1 hora antes del salto inicial
#   · NBA: un tuit al día (desde las 16:30 UTC) con los mejores picks
#   · Resumen: a la mañana siguiente (desde las 07:30 UTC)
# Sin los secrets X_API_KEY/X_API_SECRET/X_ACCESS_TOKEN/X_ACCESS_SECRET no hace nada.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tweets
  cancel-in-progress: false

jobs:
  tweet:
    runs-on: ubuntu-latest
    env:
      X_KEY: ${{ secrets.X_API_KEY }}
    steps:
      - name: Sin claves de X → nada que hacer
        if: env.X_KEY == ''
        run: echo "Faltan los secrets de X; no se publica."
      - uses: actions/checkout@v4
        if: env.X_KEY != ''
      - uses: actions/setup-node@v4
        if: env.X_KEY != ''
        with:
          node-version: '20'
      - name: Publicar lo que toque
        if: env.X_KEY != ''
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node robot/tweet.js
      - name: Guardar registro de publicaciones
        if: env.X_KEY != ''
        run: |
          git config user.name  "europicks-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/tweets.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "Nada nuevo."; exit 0; fi
          git commit -m "chore: publicaciones en X"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && break; sleep 5; done
