name: Robot Euroliga

# GitHub lanza el cron "cada hora" solo cada 4-6 horas en la práctica, así que cada ejecución
# se queda en bucle haciendo una pasada cada 20 minutos durante ~5 h 40 min (robot/cycle.sh):
# histórico, liquidación, picks, jugadores, publicaciones de /x, guardar y publicar en Cloudflare.
# Una ejecución nueva sustituye a la anterior. Las cuotas de The Odds API solo se piden cada 5 h.
# Para dispararlo a mano: pestaña Actions → Robot Euroliga → Run workflow.
# También se lanza solo al subir cambios de código (no con los commits de datos del robot).
# Publicaciones para X: robot/social.js prepara textos e imágenes del día en la página /x (gratis, sin API de X).

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['robot/**', 'public/*.js', 'public/*.html', 'public/*.css', '.github/workflows/robot.yml']

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: true          # una ejecución nueva sustituye al bucle anterior

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Robot en bucle (cada 20 min durante ~5 h 45 min)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: eu,uk
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1a88c5eceac0c86645d67e73c1038e8f
        run: |
          git config user.name  "hoopvalue-bot"
          git config user.email "bot@users.noreply.github.com"
          npx --yes wrangler@3 pages project create europicks --production-branch=main >/dev/null 2>&1 || true
          END=$(( $(date +%s) + 345*60 ))
          while :; do
            echo "── pasada $(date -u +%H:%M) UTC ──"
            bash robot/cycle.sh
            [ $(( $(date +%s) + 20*60 )) -lt $END ] || break
            sleep 1200
          done
