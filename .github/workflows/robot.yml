name: Robot Euroliga

# Cuatro pasadas al día (hora UTC; Madrid = UTC+1/+2):
#   07:10  análisis y picks del día (cuotas de apertura)
#   12:10  cuotas de JUGADORES (las casas las publican el mismo día del partido)
#   16:40  refresco de cuotas antes de los partidos (≈ cierre) y picks nuevos
#   23:20  solo resultados: liquida los picks (0 créditos de cuotas)
# Cada pasada hace Euroliga y NBA (la NBA usa cuotas gratis: Unibet/Kambi + DraftKings).
# Para dispararlo a mano: pestaña Actions → Robot Euroliga → Run workflow.
# También se lanza solo al subir cambios de código (no con los commits de datos del robot).
# X (Twitter): con los secrets X_API_KEY/X_API_SECRET/X_ACCESS_TOKEN/X_ACCESS_SECRET publica el pick
# del día a las 12:10 y el resultado a las 23:20. Al subir código nunca tuitea.

on:
  schedule:
    - cron: '10 7 * * *'
    - cron: '10 12 * * *'
    - cron: '40 16 * * *'
    - cron: '20 23 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['robot/**', 'public/*.js', 'public/*.html', 'public/*.css', '.github/workflows/robot.yml']

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      X_KEY: ${{ secrets.X_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ejecutar robot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: eu,uk
          ODDS_MODE: ${{ github.event.schedule == '20 23 * * *' && 'results' || '' }}
        run: node robot/daily.js
      - name: Ejecutar robot NBA
        continue-on-error: true            # si la NBA falla, la Euroliga se publica igual
        env:
          ODDS_MODE: ${{ github.event.schedule == '20 23 * * *' && 'results' || '' }}
        run: node robot/daily-nba.js
      - name: Recalibrar modelo (lunes)
        if: github.event.schedule == '10 7 * * *'
        run: |
          if [ "$(date -u +%u)" = "1" ]; then node robot/backtest.js; node robot/backtest.js nba; fi
      - name: Guardar cambios
        run: |
          git config user.name  "hoopvalue-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data public/data
          if git diff --staged --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "chore: robot euroliga"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push rechazado, reintento $i…"; sleep 5
          done
      - name: Publicar en Cloudflare Pages (directo, sin esperar la cola)
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1a88c5eceac0c86645d67e73c1038e8f
        run: |
          # EuroPicks (dirección principal) + hoopvalue (la antigua, para no romper enlaces)
          npx --yes wrangler@3 pages project create europicks --production-branch=main >/dev/null 2>&1 || true
          for p in europicks hoopvalue; do npx --yes wrangler@3 pages deploy public --project-name=$p --branch=main --commit-dirty=true; done
      - name: Tarjetas del pick para X (12:10 o a mano)
        if: env.X_KEY != '' && (github.event.schedule == '10 12 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          for l in euroleague nba; do
            google-chrome --headless=new --disable-gpu --hide-scrollbars --window-size=1200,675 --virtual-time-budget=15000 --screenshot=card-$l.png "https://europicks.pages.dev/card.html?l=$l&v=$GITHUB_RUN_ID" || echo "sin imagen $l"
          done
      - name: Publicar en X (pick a las 12:10 · resultados a las 23:20)
        if: env.X_KEY != '' && (github.event.schedule == '10 12 * * *' || github.event.schedule == '20 23 * * *' || github.event_name == 'workflow_dispatch')
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TWEET_MODE: ${{ github.event.schedule == '20 23 * * *' && 'results' || 'pick' }}
        run: node robot/tweet.js
      - name: Guardar registro de X
        if: env.X_KEY != ''
        run: |
          git add data/tweets.json 2>/dev/null || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: registro de publicaciones en X"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && break; sleep 5; done
