name: Robot Euroliga

# Una pasada CADA HORA (GitHub retrasa o se salta a veces las ejecuciones programadas;
# así, si una se pierde, la siguiente lo recoge). En cada pasada: histórico, liquidación,
# picks, jugadores y publicaciones de /x. Las cuotas de The Odds API (de pago por créditos)
# solo se piden cada 5 horas; el resto de pasadas reutiliza las guardadas.
# Cada pasada hace Euroliga y NBA (la NBA usa cuotas gratis: Unibet/Kambi + DraftKings).
# Para dispararlo a mano: pestaña Actions → Robot Euroliga → Run workflow.
# También se lanza solo al subir cambios de código (no con los commits de datos del robot).
# Publicaciones para X: robot/social.js prepara textos e imágenes del día en la página /x (gratis, sin API de X).

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['robot/**', 'public/*.js', 'public/*.html', 'public/*.css', '.github/workflows/robot.yml']

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ejecutar robot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: eu,uk
        run: node robot/daily.js
      - name: Ejecutar robot NBA
        continue-on-error: true            # si la NBA falla, la Euroliga se publica igual
        run: node robot/daily-nba.js
      - name: Preparar publicaciones para X (página /x)
        continue-on-error: true
        run: node robot/social.js
      - name: Recalibrar modelo (lunes)
        run: |
          if [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" = "07" ]; then node robot/backtest.js; node robot/backtest.js nba; fi
      - name: Guardar cambios
        run: |
          git config user.name  "hoopvalue-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data public/data
          if git diff --staged --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "chore: robot euroliga"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push rechazado, reintento $i…"; sleep 5
          done
      - name: Publicar en Cloudflare Pages (directo, sin esperar la cola)
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1a88c5eceac0c86645d67e73c1038e8f
        run: |
          # EuroPicks (dirección principal) + hoopvalue (la antigua, para no romper enlaces)
          npx --yes wrangler@3 pages project create europicks --production-branch=main >/dev/null 2>&1 || true
          for p in europicks hoopvalue; do npx --yes wrangler@3 pages deploy public --project-name=$p --branch=main --commit-dirty=true; done
